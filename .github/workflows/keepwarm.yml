name: keep-warm

# Pings the TrustLens backend so Render's free tier never sleeps
# (it naps after ~15 min idle, causing a slow cold start on the next scan).

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch: {}        # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /health
        run: |
          echo "Pinging backend..."
          curl -fsS --max-time 90 https://trustlens-backend-djrm.onrender.com/health \
            && echo "" && echo "backend is awake" \
            || echo "ping failed or timed out (backend may still be waking) — non-fatal"
